version: '3'
services:
  polaris-redis:
    image: redis:latest  # 使用官方Redis镜像
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - media-net
    ports:
      - "16379:6379"   # 本机直跑 WVP jar 时连 Redis（混合部署模式，见部署文档）
    volumes:
      - ./redis/conf/redis.conf:/opt/polaris/redis/redis.conf
      - ./volumes/redis/data/:/data
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server /opt/polaris/redis/redis.conf --appendonly yes

  polaris-mysql:
    image: mysql:8  # 使用官方MySQL 8镜像
    restart: unless-stopped
    mem_limit: 1024m
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/3306" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - media-net
    environment:
      MYSQL_DATABASE: wvp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wvp_user
      MYSQL_PASSWORD: wvp_password
      TZ: Asia/Shanghai
    ports:
      - "33061:3306"   # 本机直跑 WVP jar 时连 MySQL（混合部署模式）
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./logs/mysql:/logs
      - ./volumes/mysql/data:/var/lib/mysql  
      - ../数据库/2.7.4/初始化-mysql-2.7.4.sql:/docker-entrypoint-initdb.d/init.sql  # 初始化SQL脚本目录
    command: [
          # '--default-authentication-plugin=mysql_native_password',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_general_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]

  polaris-media:
    image: zlmediakit/zlmediakit:master  # 替换为官方镜像
    restart: always
    mem_limit: 512m
    networks:
      - media-net
    ports:
      - "8081:8081"     # [播流]HTTP / WebSocket (Jessibuca ws_flv 直连)
      - "${MediaRtmp:-10935}:${MediaRtmp:-10935}/tcp"   # [收流]RTMP  
      - "${MediaRtmp:-10935}:${MediaRtmp:-10935}/udp"   # [收流]RTMP  
     #- "41935:41935/tcp"   # [收流]RTMPS 无效
      - "${MediaRtsp:-5540}:${MediaRtsp:-5540}/tcp"     # [收流]RTSP  
      - "${MediaRtsp:-5540}:${MediaRtsp:-5540}/udp"     # [收流]RTSP  
     #- "45540:45540/tcp"   # [收流]RTSPS 无效
      - "${MediaRtp:-10000}:${MediaRtp:-10000}/tcp"   # [收流]RTP 单端口(旧)
      - "${MediaRtp:-10000}:${MediaRtp:-10000}/udp"
      - "10003:10003/tcp"   # [收流]RTP 单端口模式(ZLM rtp_proxy.port)
      - "10003:10003/udp"
      # 国标多端口收流：WVP 媒体节点 rtp_port_range=30000,30500，必须整段映射，否则设备推流被丢弃(收流超时)
      - "30000-30500:30000-30500/tcp"
      - "30000-30500:30000-30500/udp"
    volumes:
      - ./volumes/video:/opt/media/bin/www/record/
      - ./logs/media:/opt/media/log/
      - ./media/config.ini:/conf/config.ini
    entrypoint: [ "MediaServer" ]
    command: [
        '-c', '/conf/config.ini',
        '-l', '0'
    ]

  polaris-wvp:
    # 混合部署模式下 WVP 由本机 jar 承担（国标 SIP 必须绑真实网卡），
    # 容器版默认不启动：profiles 让它不被 `docker compose up -d` 拉起，
    # 否则它会占用 5060 与本机 jar 冲突。
    # 需要整套容器部署时显式开启：docker compose --profile container-full up -d
    profiles: ["container-full"]
    restart: "no"
    # 显式指定构建上下文和Dockerfile路径
    build:
      context: ..  # 构建上下文的根路径
      dockerfile: ./docker/wvp/Dockerfile.local  # 相对于上下文路径的Dockerfile位置
    mem_limit: 1536m
    networks:
      - media-net
    ports:
      - "18978:18978"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/udp"
      - "${SIP_Port:-8116}:${SIP_Port:-8116}/tcp"
    depends_on:
      - polaris-redis
      - polaris-mysql
      - polaris-media
    volumes:
      - ./wvp/config:/opt/wvp/config
      - ./wvp/wvp/:/opt/ylcx/wvp/
      - ./logs/wvp:/opt/wvp/logs/
      - ./volumes/patrol-media:/opt/wvp/media/patrol
      # 平台录像目录（只读）：录像对账任务读取孤儿文件实际大小用（CloudRecordReconciler）
      - ./volumes/video:/opt/media/bin/www/record/:ro
    environment:
      TZ: "Asia/Shanghai"
      # docker env
      RUN_ENV: "docker"
      # 流链接的IP
      Stream_IP: ${Stream_IP}
      # SDP里的IP
      SDP_IP: ${SDP_IP}
      # [可选] zlm服务器访问WVP所使用的IP, 默认使用127.0.0.1，zlm和wvp没有部署在同一台服务器时必须配置
      ZLM_HOOK_HOST: polaris-wvp
      ZLM_HOST: polaris-media
      ZLM_SERCERT: su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf

      MediaHttp: ${MediaHttp:-8081}
      #MediaHttps: ${WebHttps:-8081}
      MediaRtmp: ${MediaRtmp:-10935}
      MediaRtsp: ${MediaRtsp:-5540}
      MediaRtp: ${MediaRtp:-10000}

      REDIS_HOST: polaris-redis
      REDIS_PORT: 6379

      DATABASE_HOST: polaris-mysql
      DATABASE_PORT: 3306
      DATABASE_USER: wvp_user
      DATABASE_PASSWORD: wvp_password

      SIP_ShowIP: ${SIP_ShowIP}
      SIP_Port: ${SIP_Port:-8116}
      SIP_Domain: ${SIP_Domain}
      SIP_Id: ${SIP_Id}
      SIP_Password: ${SIP_Password}

      RecordSip: ${RecordSip}
      RecordPushLive: ${RecordPushLive}

  polaris-nginx:
    # 显式指定构建上下文和Dockerfile路径
    build:
      context: ..  # 构建上下文的根路径
      dockerfile: ./docker/nginx/Dockerfile  # 相对于上下文路径的Dockerfile位置
    mem_limit: 256m
    ports:
      - "${WebHttp:-8080}:8080"
    # 不依赖 polaris-wvp：nginx 通过 host.docker.internal:18978 反代本机 jar，
    # 保留依赖会让 compose 顺手创建 wvp 容器并抢占 5060。
    volumes:
      - ./nginx/templates/:/etc/nginx/templates
      - ./logs/nginx:/var/log/nginx
      - ./volumes/patrol-media:/opt/patrol-media:ro
      - ../src/main/resources/static:/opt/dist:ro
    environment:
      # 流链接的IP
      Stream_IP: ${Stream_IP}
    networks:
      - media-net

  # 本地边缘 YOLO 推理服务（CPU / 限线程 / 单worker / 限入参，mem_limit 1536m 防 OOM）
  yolo-service:
    build:
      context: ..
      dockerfile: ./docker/yolo/Dockerfile
    restart: unless-stopped
    mem_limit: 1536m
    networks:
      - media-net
    ports:
      - "8999:8999"
    volumes:
      - ./logs/yolo:/app/logs
      - ./volumes/patrol-models:/app/models
    environment:
      TZ: "Asia/Shanghai"
      YOLO_MODELS_DIR: "/app/models"

networks:
  media-net:
    driver: bridge